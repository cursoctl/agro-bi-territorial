services:
  postgres:
    # Trocamos para a imagem oficial que já vem com o PostGIS embutido
    image: postgis/postgis:16-3.4
    container_name: agro_bi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agro_bi
      POSTGRES_USER: agro_user
      POSTGRES_PASSWORD: agro_local_dev
    ports:
      - "5434:5432" # Mantém a porta 5434 que funcionou sem conflitos no seu WSL
    volumes:
      - agro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro_user -d agro_bi"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  agro_pgdata:

